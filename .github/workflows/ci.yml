name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: scanner
          POSTGRES_PASSWORD: scannerpass
          POSTGRES_DB: scanner_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v2
      with:
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.11

    - name: Install API dependencies
      run: |
        cd apps/api
        uv venv
        uv pip install -e ".[dev]"

    - name: Run API tests
      run: |
        cd apps/api
        uv run pytest

    - name: Install Scanner dependencies
      run: |
        cd packages/scanner
        uv venv
        uv pip install -e ".[dev]"

    - name: Run Scanner tests
      run: |
        cd packages/scanner
        uv run pytest